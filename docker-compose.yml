include:
  - docker-compose.db.yml
  - docker-compose.app.yml

services:
  rbmq:
    image: rabbitmq:3-management
    ports:
      - "5472:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    networks:
      - prodplace
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 5s
      timeout: 10s
      retries: 10

  keycloak:
    image: prodplace-keycloak-prebuilt:latest
    build:
      context: ./keycloak-prebuilt
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: localhost
    networks:
      - prodplace
    restart: always
    depends_on:
      - keycloak-db

  keycloak-db:
    image: postgres:17-alpine
    volumes:
      - keycloak-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    networks:
      - prodplace

volumes:
  mongodb-data:
    driver: local
  products-db-data:
    driver: local
  currencies-db-data:
    driver: local
  identity-db-data:
    driver: local
  redis-cache-data:
    driver: local
  rabbitmq-data:
    driver: local
  orders-data:
    driver: local
  customers-data:
    driver: local
  keycloak-data:
    driver: local

networks:
  prodplace:
    driver: bridge