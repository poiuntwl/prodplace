services:
  products-db:
    build:
      context: ./dbs/products
      dockerfile: ./Dockerfile
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "5400:1433"
    networks:
      - prodplace
    volumes:
      - products-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    profiles: ["db", "full"]

  currencies-db:
    build:
      context: ./dbs/currencies
      dockerfile: ./Dockerfile
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "5401:1433"
    networks:
      - prodplace
    volumes:
      - currencies-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    profiles: ["db", "full"]

  identity-db:
    build:
      context: ./dbs/identity
      dockerfile: ./Dockerfile
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "5402:1433"
    networks:
      - prodplace
    volumes:
      - identity-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" || exit 1
      interval: 5s
      retries: 15
      start_period: 10s
      timeout: 3s
    profiles: ["db", "full"]

  orders-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ordersDb
    ports:
      - "5403:5432"
    networks:
      - prodplace
    volumes:
      - orders-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ordersDb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["db", "full"]

  customers-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=customersDb
    ports:
      - "5404:5432"
    networks:
      - prodplace
    volumes:
      - customers-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d customersDb" ]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles: ["db", "full"]

  mongodb:
    build:
      context: ./mongo
      dockerfile: ./Dockerfile
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - prodplace
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    profiles: ["db", "full"]

  redis-cache:
    build:
      context: ./redis-cache
      dockerfile: ./Dockerfile
    ports:
      - "6379:6379"
    volumes:
      - redis-cache-data:/data/db
    networks:
      - prodplace
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    profiles: ["db", "full"]


# Note: volumes and networks are defined in docker-compose.yml (parent file)