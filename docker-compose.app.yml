services:
  reverse-proxy:
    image: reverse-proxy
    build:
      context: .
      dockerfile: ./ProxyService/Dockerfile
      args:
        PROJECT_NAME: ProxyService
    networks:
      - prodplace
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - PROJECT_NAME=ProxyService
    ports:
      - "44300:8080"
    profiles: ["app", "full"]

  products-service:
    image: products-service
    build:
      context: .
      dockerfile: ./ProductsService/Dockerfile
      args:
        PROJECT_NAME: ProductsService
    depends_on:
      products-db:
        condition: service_healthy
      rbmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/health || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - prodplace
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - PROJECT_NAME=ProductsService
    ports:
      - "44301:8080"
    profiles: ["app", "full"]

  price-service:
    image: price-service
    build:
      context: .
      dockerfile: ./PriceService/Dockerfile
      args:
        PROJECT_NAME: PriceService
    networks:
      - prodplace
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - PROJECT_NAME=PriceService
    ports:
      - "44302:8080"
    profiles: ["app", "full"]

  currency-rates-service:
    image: currency-rates-service
    build:
      context: .
      dockerfile: ./CurrencyRatesService/Dockerfile
      args:
        PROJECT_NAME: CurrencyRatesService
    depends_on:
      currencies-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - prodplace
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - PROJECT_NAME=CurrencyRatesService
    ports:
      - "44303:8080"
    profiles: ["app", "full"]

  identity-service:
    image: identity-service
    build:
      context: .
      dockerfile: ./IdentityService/Dockerfile
      args:
        PROJECT_NAME: IdentityService
    depends_on:
      identity-db:
        condition: service_healthy
    networks:
      - prodplace
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - PROJECT_NAME=IdentityService
    ports:
      - "44304:8080"
    profiles: ["app", "full"]

  order-service:
    image: order-service
    build:
      context: .
      dockerfile: ./OrderService/Dockerfile
      args:
        PROJECT_NAME: OrderService
    depends_on:
      orders-db:
        condition: service_healthy
    networks:
      - prodplace
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - PROJECT_NAME=OrderService
    ports:
      - "44305:8080"
    profiles: ["app", "full"]

  customer-service:
    image: customer-service
    build:
      context: .
      dockerfile: ./CustomerService/Dockerfile
      args:
        PROJECT_NAME: CustomerService
    depends_on:
      customers-db:
        condition: service_healthy
    networks:
      - prodplace
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - PROJECT_NAME=CustomerService
    ports:
      - "44306:8080"
    profiles: ["app", "full"]

  admin-service:
    image: admin-service
    build:
      context: .
      dockerfile: ./Prodplace.Admin/Dockerfile
      args:
        PROJECT_NAME: Prodplace.Admin
    depends_on:
      identity-service:
        condition: service_started
    networks:
      - prodplace
    environment:
      - ASPNETCORE_ENVIRONMENT=docker
      - PROJECT_NAME=Prodplace.Admin
      - Grpc__IdentityServiceConnectionString=http://identity-service:8080
      - Services__CurrencyRatesService=http://currency-rates-service:8080
    ports:
      - "44307:8080"
    profiles: ["app", "full"]

  backoffice-web:
    image: backoffice-web
    build:
      context: ./backoffice-web
      dockerfile: Dockerfile
    ports:
      - "12346:12346"
    networks:
      - prodplace
    profiles: ["app", "full"]

  frontend:
    image: prodplace-frontend
    build:
      context: ./fe
      dockerfile: Dockerfile
    ports:
      - "12345:12345"
    networks:
      - prodplace
    profiles: ["app", "full"]


# Note: networks are defined in docker-compose.yml (parent file)