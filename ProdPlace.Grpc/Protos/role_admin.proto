syntax = "proto3";

option csharp_namespace = "RoleAdmin";

service RoleAdminService {
  rpc CreateRole (CreateRoleRequest) returns (RoleResponse);
  rpc DeleteRole (DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc AssignRole (AssignRoleRequest) returns (AssignRoleResponse);
  rpc UnassignRole (UnassignRoleRequest) returns (UnassignRoleResponse);
  rpc ListRoles (Empty) returns (ListRolesResponse);
  rpc ListUsersWithRoles (Empty) returns (ListUsersWithRolesResponse);
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
}

message RoleResponse {
  bool success = 1;
}

message DeleteRoleRequest {
  string name = 1;
}

message DeleteRoleResponse {
  bool success = 1;
}

message AssignRoleRequest {
  string user_id = 1;
  string role_name = 2;
}

message AssignRoleResponse {
  bool success = 1;
}

message UnassignRoleRequest {
  string user_id = 1;
  string role_name = 2;
}

message UnassignRoleResponse {
  bool success = 1;
}

message Empty {}

message RoleInfo {
  string name = 1;
  string description = 2;
}

message ListRolesResponse {
  repeated RoleInfo roles = 1;
}

message UserWithRolesInfo {
  string user_id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  repeated string roles = 5;
}

message ListUsersWithRolesResponse {
  repeated UserWithRolesInfo users = 1;
}
